services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: byteverse
      POSTGRES_USER: byteverse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byteverse"]
      interval: 10s
      timeout: 5s
      retries: 5

  judge0-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:?JUDGE0_DB_PASSWORD is required}
    volumes:
      - judge0pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  judge0:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    volumes:
      - ./docker/judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    depends_on:
      judge0-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: judge0-db
      POSTGRES_USER: judge0
      POSTGRES_DB: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JUDGE0_DB_PASSWORD: ${JUDGE0_DB_PASSWORD}
      JUDGE0_WEBHOOK_SECRET: ${JUDGE0_WEBHOOK_SECRET:?JUDGE0_WEBHOOK_SECRET is required}
      AUTH_TOKEN: ${JUDGE0_API_KEY}

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ["npx", "prisma", "db", "push"]
    environment:
      DATABASE_URL: postgresql://byteverse:${POSTGRES_PASSWORD}@postgres:5432/byteverse
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://byteverse:${POSTGRES_PASSWORD}@postgres:5432/byteverse
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JUDGE0_URL: http://judge0:2358
      JUDGE0_WEBHOOK_SECRET: ${JUDGE0_WEBHOOK_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      ADMIN_PIN: ${ADMIN_PIN:?ADMIN_PIN is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "0.0.0.0:3000:3000"

volumes:
  pgdata:
  judge0pgdata:
  redisdata:
